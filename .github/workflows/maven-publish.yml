name: Publish JetLinks snapshot reactor
run-name: Snapshot 1.3 - ${{ inputs.source_repository || github.repository }} @ ${{ inputs.source_sha || github.sha }}

on:
  push:
    branches: ['1.3']
  workflow_dispatch:
    inputs:
      source_repository:
        description: Repository that requested a build (empty for a manual refresh)
        type: string
        required: false
      source_sha:
        description: Commit that requested a build
        type: string
        required: false
      source_ref:
        description: Release branch
        type: choice
        options: ['1.3']
        default: '1.3'

permissions:
  contents: read

concurrency:
  group: jetlinks-snapshot-1.3
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/1.3'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: '1.3'
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze current release sources
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository || (github.event_name == 'push' && github.repository) || '' }}
          SOURCE_SHA: ${{ inputs.source_sha || (github.event_name == 'push' && github.sha) || '' }}
          SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
        run: python3 .github/scripts/snapshot_sources.py prepare --manifest "$RUNNER_TEMP/snapshot-sources.json"
      - name: Set up Java and Maven credentials
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          cache-dependency-path: '**/pom.xml'
          server-id: snapshots
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Check snapshot source and publication contracts
        run: python3 -m unittest discover -s .github/scripts -p test_snapshot_sources.py
      - name: Build and publish the frozen reactor
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode -U -DskipTests -DdeployAtEnd=true clean deploy 2>&1 | tee "$RUNNER_TEMP/maven-publish.log"
      - name: Verify every reactor artifact was uploaded
        run: python3 .github/scripts/snapshot_sources.py verify --manifest "$RUNNER_TEMP/snapshot-sources.json" --log "$RUNNER_TEMP/maven-publish.log"
      - name: Save source identities and publication log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/snapshot-sources.json
            ${{ runner.temp }}/maven-publish.log
          if-no-files-found: error
          retention-days: 30
